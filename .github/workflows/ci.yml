name: Test, build, deploy

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: elsakr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.changes.outputs.runtime_changed }}
    services:
      redis-cache:
        image: redis:7-alpine
        ports: [13000:6379]
      redis-queue:
        image: redis:7-alpine
        ports: [11000:6379]
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect runtime changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          runtime_changed=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            runtime_changed=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || [[ "$BEFORE" =~ ^0+$ ]] || \
              ! git cat-file -e "$BEFORE^{commit}"; then
              runtime_changed=true
            elif ! git diff --name-only -z "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files"; then
              runtime_changed=true
            else
              while IFS= read -r -d '' path; do
                case "$path" in
                  README.md|CLIENT_UPDATES.md|.github/*|deploy/rollout.sh|deploy/runner-entrypoint.sh|deploy/runner.compose.yaml|deploy/bootstrap.sh|.gitignore) ;;
                  *) runtime_changed=true ;;
                esac
              done < "$RUNNER_TEMP/changed-files"
            fi
          fi
          echo "runtime_changed=$runtime_changed" >> "$GITHUB_OUTPUT"
          echo "Runtime changed: $runtime_changed"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Validate app list
        run: |
          python -m pip install PyYAML==6.0.3
          python deploy/render_apps.py /tmp/apps.json
          APP_IMAGE=local/test DB_PASSWORD=test docker compose -f deploy/compose.yaml config --format json | python -c \
            'import json,sys; s=json.load(sys.stdin)["services"]; assert s["queue-short"]["command"] == ["bench","worker","--queue","short,default"]; assert s["queue-long"]["command"] == ["bench","worker","--queue","long,default,short"]'
      - name: Install Bench
        run: |
          python -m pip install frappe-bench
          attempt=1
          until bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets \
            --python "$(command -v python)" "$HOME/frappe-bench"; do
            if (( attempt >= 3 )); then exit 1; fi
            rm -rf "$HOME/frappe-bench"
            sleep $((attempt * 10))
            ((attempt += 1))
          done
      - name: Install applications and build assets
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
        run: |
          bench get-app --branch version-15 erpnext https://github.com/frappe/erpnext
          bench get-app --branch develop arab_erp_theme https://github.com/00JIMMY00/arab_erp_theme
          bench get-app elsakr_app "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app arab_erp_theme
          bench --site test_site install-app elsakr_app
          bench --site test_site migrate
          bench build
          bench --site test_site list-apps -f json | python -c \
            'import json,sys; a=json.load(sys.stdin)["test_site"]; assert all(x in a for x in ("erpnext","arab_erp_theme","elsakr_app"))'
      - name: Run application tests when present
        working-directory: /home/runner/frappe-bench
        run: |
          if find "$GITHUB_WORKSPACE/elsakr_app" -name 'test_*.py' | grep -q .; then
            bench --site test_site set-config allow_tests true
            bench --site test_site run-tests --app elsakr_app --skip-test-records
          fi

  image:
    if: github.ref == 'refs/heads/main' && needs.tests.outputs.runtime_changed == 'true'
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Render app list
        run: |
          python -m pip install PyYAML==6.0.3
          python deploy/render_apps.py /tmp/apps.json
      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: d84154ae23ab7ae756dfe942e3f24dcd70d1fbda
          path: frappe_docker
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image_name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./deploy/Containerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image_name.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            FRAPPE_BRANCH=version-15
            APP_COMMIT=${{ github.sha }}
            CACHE_BUST=${{ github.sha }}
          secret-files: |
            apps_json=/tmp/apps.json
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image contents
        env:
          IMAGE: ${{ steps.image_name.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker run --rm --entrypoint bash -e APP_COMMIT="$GITHUB_SHA" "$IMAGE" -lc \
            'test "$(cat apps/elsakr_app/.source-commit)" = "$APP_COMMIT" && \
             grep -qx arab_erp_theme sites/apps.txt && grep -qx erpnext sites/apps.txt'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable image
        id: publish
        env:
          IMAGE: ${{ steps.image_name.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker push "$IMAGE" | tee /tmp/elsakr-push.log
          digest=$(awk '/digest: sha256:/ {print $3}' /tmp/elsakr-push.log | tail -1)
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ref=${IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: [self-hosted, linux, x64, elsakr-deploy]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy on client machine
        env:
          IMAGE_REF: ${{ needs.image.outputs.ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          cp deploy/compose.yaml /home/hassan/elsakr/next.compose.yaml
          awk '/^  - name: / { print $3 }' apps.yml > /home/hassan/elsakr/next.apps.txt
          bash deploy/rollout.sh "$IMAGE_REF" /home/hassan/elsakr
