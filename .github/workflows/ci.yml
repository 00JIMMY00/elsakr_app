name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elsakr-production
  cancel-in-progress: false

jobs:
  image:
    runs-on: [self-hosted, linux, x64, elsakr-deploy]
    outputs:
      ref: ${{ steps.image_ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Render app list
        run: python3 deploy/render_apps.py "$RUNNER_TEMP/apps.json"
      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: d84154ae23ab7ae756dfe942e3f24dcd70d1fbda
          path: frappe_docker
      - name: Build image with latest app branches
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          docker build \
            --file deploy/Containerfile \
            --build-arg FRAPPE_BRANCH=version-15 \
            --build-arg APP_COMMIT="$GITHUB_SHA" \
            --build-arg CACHE_BUST="$GITHUB_SHA" \
            --secret id=apps_json,src="$RUNNER_TEMP/apps.json" \
            --tag "elsakr:sha-$GITHUB_SHA" \
            ./frappe_docker
      - name: Record image
        id: image_ref
        run: echo "ref=elsakr:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    runs-on: [self-hosted, linux, x64, elsakr-deploy]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy on client machine
        env:
          IMAGE_REF: ${{ needs.image.outputs.ref }}
        run: |
          set -euo pipefail
          cp deploy/compose.yaml /home/hassan/elsakr/next.compose.yaml
          awk '/^  - name: / { print $3 }' apps.yml > /home/hassan/elsakr/next.apps.txt
          bash deploy/rollout.sh "$IMAGE_REF" /home/hassan/elsakr
