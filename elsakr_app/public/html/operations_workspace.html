<main class="ops" dir="rtl" aria-label="إدارة المحل">
	<section class="ops-daily" aria-label="إجراءات سريعة" hidden>
		<div class="ops-actions"></div>
	</section>
	<section class="ops-directory" aria-label="أدوات المحل">
		<div class="ops-status" role="status" aria-live="polite">
			<span>جارٍ تحميل أدوات العمل…</span>
			<button type="button" data-retry hidden>إعادة المحاولة</button>
		</div>
		<div class="ops-groups" aria-busy="true"></div>
	</section>
</main>
